<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BogorDex v107 AR - Chibi Gen Z Edition</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="map"></div>
    <div class="rain-layer rain-front"></div>
    <div class="cloud-band cloud-band-b"></div>
    <div class="mist-layer mist-layer-a"></div>
    <div class="mist-layer mist-layer-b"></div>
    <div class="snow-dust"></div>
    <div id="npcLayer" class="npc-layer" aria-label="NPC BogorDex"></div>

    <!-- MAIN PLAYER ANCHOR (PRIORITY FOCUS) -->
    <div class="player-anchor">
      <div class="player-shadow"></div>
      <div id="playerSprite" class="player-sprite chibi-sprite idle"></div>
    </div>

    <!-- 1. FLOATING STATUS & WEATHER BUBBLE (TOP LEFT) -->
    <header class="top-hud-bubble top-left-status">
      <div id="statusIndicator" class="live-status compact">
        <span id="statusLamp" class="status-lamp status-online"></span>
        <span class="status-label">BOGORDEX AR</span>
      </div>
      <div id="weatherChip" class="weather-chip-bubble">
        <span id="weatherIcon" class="weather-icon">⛅</span>
        <span id="weatherTemp">26°C</span>
        <span id="weatherLocTime" class="hidden-mobile">--:-- • Bogor</span>
      </div>
    </header>

    <!-- 2. SIDE CONTROLS BUBBLE PACK (RIGHT) -->
    <div class="side-controls-bubble-pack">
      <button id="resetViewBtn" class="action-bubble fab-compass" title="Kompas"><span>🧭 Map</span></button>
      <button id="locateBtn" class="action-bubble fab-locate" title="GPS"><span>🛰️ GPS</span></button>
      <button id="chatToggleBtn" class="action-bubble chat-toggle-bubble" title="Chat"><span>💬 Chat</span></button>
    </div>

    <!-- 3. TOP QUICK FILTERS TRAY -->
    <div class="top-actions-tray">
      <button id="toggleTransitBtn" class="pill active">🚌 BisKita</button>
      <button id="toggleUmkmBtn" class="pill active">🛍️ UMKM</button>
    </div>

    <!-- 4. BOTTOM-LEFT CHARACTER HUD & BOTTOM-RIGHT NAV TRAY -->
    <footer class="bottom-hud-floating-tray">
      <!-- Player HUD Bubble -->
      <div id="playerHudBtn" class="bottom-left-player-bubble">
        <div class="chibi-avatar-ui"></div>
        <div class="chibi-meta">
          <div class="chibi-level">Lv 10 Ranger</div>
          <div class="chibi-name">Ranger Panji</div>
        </div>
      </div>
      
      <!-- Central Control Orb (Smaller & Floating) -->
      <button id="mainMenuBtn" class="central-floating-orb" title="Menu utama">
        <div class="central-orb-orb">BD</div>
      </button>

      <!-- Bottom Nav Bubbles -->
      <nav id="bottomGameNav" class="bottom-game-nav-tray" aria-label="Navigasi">
        <button id="bottomHomeBtn" class="nav-bubble active" type="button"><span class="nav-ico">🗺️</span><small>Map</small></button>
        <button id="bottomHubBtn" class="nav-bubble ar-hub-bubble" type="button" aria-label="AR"><span class="nav-ico">📷</span><small>AR</small></button>
        <button id="bottomInventoryBtn" class="nav-bubble" type="button"><span class="nav-ico">🎒</span><small>Bag</small></button>
        <button id="bottomProfileBtn" class="nav-bubble" type="button"><span class="nav-ico">👤</span><small>Prof</small></button>
      </nav>
    </footer>

    <!-- D-PAD CONTROLLER OVERLAY (Z-INDEX CHECK) -->
    <div class="move-pad" aria-label="Kontrol gerak">
      <button class="move-btn up" data-dir="up">▲</button>
      <button class="move-btn left" data-dir="left">◀</button>
      <button class="move-btn right" data-dir="right">▶</button>
      <button class="move-btn down" data-dir="down">▼</button>
    </div>

    <!-- MODALS & OVERLAYS -->
    <!-- (Retaining existing MODAL structure with Chibi styling) -->
    <div id="arCameraModal" class="chibi-modal hidden" aria-label="AR Kamera">
      <div class="chibi-modal-card">
        <button id="arCameraCloseBtn" class="chibi-close-btn" type="button">×</button>
        <div class="chibi-modal-head"><h3>AR Kamera 📷</h3></div>
        <div class="chibi-ar-preview">
          <video id="arCameraVideo" autoplay playsinline muted></video>
          <div class="chibi-ar-placeholder">
            <span>📷</span>
            <b>Kamera belum aktif</b>
          </div>
        </div>
      </div>
    </div>

    <!-- MAIN MENU MODAL (Chibi Grid) -->
    <div id="mainMenuModal" class="chibi-menu-modal hidden">
      <div class="chibi-menu-backdrop"></div>
      <div class="chibi-menu-card">
        <button id="closeMainMenuBtn" class="chibi-close-btn">×</button>
        <div class="chibi-menu-orb">BD</div>
        <h2>BogorDex Quest Hub</h2>
        <div class="chibi-menu-grid">
          <button id="menuScanBtn" class="chibi-menu-item">
            <span class="menu-emoji">📡</span>
            <strong>Scan Terdekat</strong>
          </button>
          <button id="menuDexBtn" class="chibi-menu-item">
            <span class="menu-emoji">📘</span>
            <strong>Info Ranger</strong>
          </button>
        </div>
      </div>
    </div>

    <!-- (Inventory, Profile, MapDex, Citizen Report are also Chibi-fied internally) -->

    <!-- HUD TOASTS & NOTIFICATIONS -->
    <div id="animeToastStack" class="anime-toast-stack"></div>
  </div>
  
  <script src="data.js"></script>
  <script>
    (function(){
      const scriptUrls = ["https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"];
      function loadScript(src){
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = src; s.async = false;
          s.onload = resolve; s.onerror = reject;
          document.body.appendChild(s);
        });
      }
      async function boot(){
        try {
          if (!window.maplibregl) { await loadScript(scriptUrls[0]); }
          const s = document.createElement("script");
          s.src = "app.js";
          document.body.appendChild(s);
        } catch(e) { console.error("Engine failure", e); }
      }
      boot();
    })();
  </script>
</body>
</html>
